services:
  app:
    build: .                       # build the Dockerfile in this folder
    ports:
      - "8501:8501"                # host:container — open http://localhost:8501
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434   # 'ollama' = the service name below, NOT localhost
      OLLAMA_MODEL: qwen2.5-coder:latest
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama   # persist pulled models across restarts

volumes:
  ollama-models:
